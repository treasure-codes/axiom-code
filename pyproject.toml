[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-code"
version = "0.1.0"
description = "Autonomous Semantic Analysis & Interpretability Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
axiom = "axiom.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["axiom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
